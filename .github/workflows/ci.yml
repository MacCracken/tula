name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of truth
        # for the toolchain version — nothing is hardcoded here. Use the
        # upstream installer so the versioned ~/.cyrius/versions/<ver>/ layout
        # matches how cyrius resolves the pin.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # `cyrius deps` reads [deps] from cyrius.cyml: the stdlib set (copied
        # from the installed toolchain) plus `sigil` (fetched from GitHub via
        # [deps.sigil] git+tag). The `path = "../sigil"` beside it is read only
        # in local mode (CYRIUS_LOCAL=1 / --local), which CI never sets, so CI
        # and a default local build resolve the same tag (cyrius >= 6.7.6).
        # Requires the sigil tag to exist on GitHub. lib/ must be a real dir,
        # never a symlink.
        run: |
          rm -rf lib
          mkdir lib
          cyrius deps

      - name: Lint
        # Hard gate: any `warn ` severity line fails CI. (Build-time `warning:`
        # notes like pin-drift / large-static are not `warn ` and don't gate.)
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr examples/*.cyr tests/tcyr/*.tcyr; do
            [ -e "$f" ] || continue
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            if echo "$out" | grep -qE '^[[:space:]]*warn '; then
              echo "lint: warnings in $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Format check
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr examples/*.cyr tests/tcyr/*.tcyr; do
            [ -e "$f" ] || continue
            if ! cyrius fmt "$f" --check > /dev/null 2>&1; then
              echo "needs fmt: $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Vet
        run: cyrius vet programs/smoke.cyr

      - name: Verify dist bundle is in sync with src/
        run: |
          cyrius distlib
          if ! git diff --quiet dist/tula.cyr; then
            echo "ERROR: dist/tula.cyr is stale. Run 'cyrius distlib' and commit the result."
            git --no-pager diff dist/tula.cyr | head -40
            exit 1
          fi
          echo "dist/tula.cyr matches src/"

      - name: Build (link-check, DCE on)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build programs/smoke.cyr build/tula_smoke
          echo "smoke: $(wc -c < build/tula_smoke) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/tula_smoke | grep -q "7f45 4c46"

      - name: Test (CPU-only suites)
        run: |
          for f in tests/tcyr/*.tcyr; do cyrius test "$f" || exit 1; done

      - name: Downstream consumer (v1.0 gate — end-to-end)
        run: |
          CYRIUS_DCE=1 cyrius build examples/consumer.cyr build/tula_consumer
          ./build/tula_consumer

      - name: Real-model inventories (1.5.0 gate — GPT-2, Llama-2-7B, Mixtral, LoRA, QLoRA, GPTQ)
        # Real tensor names, ranks, counts and dtypes; dims divided by 64. Each is
        # written signed, read back, strict-validated, verified, and every tensor
        # resolved through the name index and tula_find_name.
        run: |
          CYRIUS_DCE=1 cyrius build programs/realmodels.cyr build/tula_realmodels
          ./build/tula_realmodels

      - name: Big file (1.4.0 gate — 2.36 GB, one tensor over INT_MAX, past the 2 GiB allocation cap; 1.6.2 writes it back)
        # Unsigned: seconds. The signed variant (make bigfile-signed) takes minutes,
        # bound by sigil's SHA-512, and runs locally; signed streaming is checked
        # byte-for-byte against the in-memory writer in tests/tcyr/stream.tcyr.
        run: |
          CYRIUS_DCE=1 cyrius build programs/bigfile.cyr build/tula_bigfile
          ./build/tula_bigfile

      - name: Fuzz (reader hardening + the streaming writers, ~1 min)
        # 2.9M hostile buffers through every reader, each placed against a
        # PROT_NONE guard page, then (1.6.1, phase H) 1,500 random builders
        # written through tula_builder_write_file(_signed), each file compared
        # byte for byte with tula_builder_finish(_signed). Fixed seed.
        run: |
          CYRIUS_DCE=1 cyrius build programs/fuzz.cyr build/tula_fuzz
          ./build/tula_fuzz

  cross-target:
    # 1.6.1: the file paths beyond x86_64 Linux. mmap, lseek, SIGBUS, rename and
    # fsync differ in the details between kernels, and qemu-user can't show
    # that (it runs on the host kernel), so these are native runners. The
    # host-independent gates (lint, fmt, vet, the dist bundle) stay in `build`.
    # Both legs are hard gates. `experimental: true` makes a new leg
    # informational until its first green run.
    name: Cross-target (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64 Linux
            os: ubuntu-26.04-arm
            experimental: false
          - name: arm64 macOS
            # macos-15 is arm64 (macos-15-intel is the Intel image). GitHub
            # retired macos-14, the image 1.6.1 first ran green on, on
            # 2026-11-02; jobs asking for it get no runner.
            os: macos-15
            # A hard gate since 1.6.2: informational until its first green run,
            # which was 1.6.1's (every step, the fuzzer included).
            experimental: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Same as `build`: the cyrius.cyml pin, the upstream installer (which
        # picks the <arch>-linux or <arch>-macos tarball).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION on $(uname -sm)"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          rm -rf lib
          mkdir lib
          cyrius deps

      - name: Build (link-check, DCE on)
        # cyrius build ad-hoc codesigns its Mach-O output on macOS.
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build programs/smoke.cyr build/tula_smoke
          echo "smoke: $(wc -c < build/tula_smoke) bytes"

      - name: Test (CPU-only suites, the file-I/O ones included)
        run: |
          for f in tests/tcyr/*.tcyr; do cyrius test "$f" || exit 1; done

      - name: Downstream consumer
        run: |
          CYRIUS_DCE=1 cyrius build examples/consumer.cyr build/tula_consumer
          ./build/tula_consumer

      - name: Real-model inventories
        run: |
          CYRIUS_DCE=1 cyrius build programs/realmodels.cyr build/tula_realmodels
          ./build/tula_realmodels

      - name: Big file (2.36 GB, one tensor over INT_MAX; streamed, mapped, validated, read, written back)
        run: |
          CYRIUS_DCE=1 cyrius build programs/bigfile.cyr build/tula_bigfile
          ./build/tula_bigfile

      - name: Fuzz (reader hardening + the streaming writers)
        run: |
          CYRIUS_DCE=1 cyrius build programs/fuzz.cyr build/tula_fuzz
          ./build/tula_fuzz

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        # Matches code lines only — rejects patterns in # comments.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ programs/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          scan "raw execve"  'syscall( *59'
          scan "raw fork"    'syscall( *57'
          scan "sys_system"  '\bsys_system\s*('
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING (required): $f"; MISSING=1; fi
          done
          for f in CONTRIBUTING.md SECURITY.md LICENSE; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  WARN (optional, not yet present): $f"; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION file: $VERSION"
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"
